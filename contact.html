<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — YantraPlus</title>
  <meta name="description" content="Get in touch with YantraPlus for order queries, product questions, or support. Reach us via WhatsApp, email, phone or the contact form.">
  <link rel="canonical" href="https://yourdomain.com/contact.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="page-loader"><div class="loader-spinner"></div></div>

  <header class="site-header" id="site-header"></header>
  <div id="whatsapp-float" class="whatsapp-float"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p>We usually reply within a few hours.</p>
      </div>
    </section>

    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div>

      <div class="contact-layout">
        <!-- Contact Info -->
        <div class="content-block">
          <h2>Get In Touch</h2>
          <div class="contact-info-list mt-1" id="contact-info-list">
            <!-- Filled by JS from BRAND config — only shows fields that are actually set -->
          </div>
          <a href="#" id="contact-whatsapp-btn" target="_blank" rel="noopener" class="btn btn-success btn-block">Chat on WhatsApp</a>
        </div>

        <!-- Contact Form -->
        <div class="content-block">
          <h2>Send Us a Message</h2>
          <p class="form-note mb-1">This form works offline (no backend) — it opens WhatsApp with your message pre-filled, ready to send.</p>
          <form class="contact-form" id="contact-form">
            <div class="form-group">
              <label for="cf-name">Full Name *</label>
              <input type="text" id="cf-name" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="cf-phone">Your Phone/WhatsApp Number *</label>
              <input type="tel" id="cf-phone" required placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
              <label for="cf-subject">Subject *</label>
              <select id="cf-subject" required>
                <option value="">Select a topic</option>
                <option>Order Query</option>
                <option>Product Question</option>
                <option>Return / Refund</option>
                <option>Delivery Issue</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="cf-message">Message *</label>
              <textarea id="cf-message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send via WhatsApp</button>
            <div id="form-success">✅ Opening WhatsApp with your message ready to send.</div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/main.js"></script>
  <script>
    renderHeader('contact');

    // Fill contact info from BRAND config — only render fields that are
    // actually set, so we never display invented details.
    const infoList = document.getElementById('contact-info-list');
    const infoItems = [
      BRAND.phone ? { icon: '📞', label: 'Call / WhatsApp', value: BRAND.phone } : null,
      BRAND.email ? { icon: '✉️', label: 'Email', value: BRAND.email } : null,
      BRAND.address ? { icon: '📍', label: 'Address', value: BRAND.address } : null
    ].filter(Boolean);
    infoList.innerHTML = infoItems.length
      ? infoItems.map(i => `
          <div class="contact-info-item">
            <div class="ci-icon">${i.icon}</div>
            <div><strong>${i.label}</strong><br>${i.value}</div>
          </div>`).join('')
      : `<p style="font-size:13.5px; color:var(--text-muted);">The fastest way to reach us is WhatsApp — button below.</p>`;

    document.getElementById('contact-whatsapp-btn').href =
      `https://wa.me/${BRAND.whatsappNumber}?text=${encodeURIComponent('Hi YantraPlus! I need some help.')}`;

    // Handle contact form submit -> opens WhatsApp with pre-filled message
    // (No backend/server and no confirmed business email, so WhatsApp is
    // the reliable way to "send" a message here.)
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('cf-name').value.trim();
      const phone = document.getElementById('cf-phone').value.trim();
      const subject = document.getElementById('cf-subject').value;
      const message = document.getElementById('cf-message').value.trim();

      const text = `Hi YantraPlus! I have a query.\n\nName: ${name}\nMy Phone: ${phone}\nSubject: ${subject}\n\nMessage:\n${message}`;
      const waLink = `https://wa.me/${BRAND.whatsappNumber}?text=${encodeURIComponent(text)}`;

      window.open(waLink, '_blank');

      document.getElementById('form-success').classList.add('show');
      this.reset();
    });
  </script>
</body>
</html>
