  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

  <div id="page-loader"><div class="loader-spinner"></div></div>

  <header class="site-header" id="site-header"></header>
  <div id="whatsapp-float" class="whatsapp-float"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Frequently Asked Questions</h1>
        <p>Everything you need to know before you shop</p>
      </div>
    </section>

    <div class="container" style="max-width:760px;">
      <div class="breadcrumb"><a href="index.html">Home</a> / FAQ</div>

      <div id="faq-list">
        <!-- Populated by inline script below -->
      </div>

      <div class="content-block text-center mt-2">
        <h2 data-i18n="faq.stillQuestions">Still have questions?</h2>
        <p>Our team is happy to help you directly.</p>
        <a href="contact.html" class="btn btn-primary mt-1" data-i18n="faq.contactSupport">Contact Support</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderHeader('faq');

    // FAQ data — edit/add questions here
    const FAQS = [
      {
        q: "How do I place an order?",
        a: "Browse our Products page, tap on any item to view details, then click 'Buy Now'. You'll be taken to a simple UPI payment page to complete your purchase."
      },
      {
        q: "What payment methods do you accept?",
        a: "We currently accept UPI payments only (Google Pay, PhonePe, Paytm, BHIM, or any UPI app) via QR code or UPI ID. After payment, simply send your screenshot on WhatsApp to confirm your order."
      },
      {
        q: "How will I know my order is confirmed?",
        a: "Once you send your payment screenshot via WhatsApp, we verify it manually and confirm your order with delivery details directly on WhatsApp."
      },
      {
        q: "How long does delivery take?",
        a: "Delivery time depends on your location and courier availability. Message us on WhatsApp after ordering and we'll share an estimated timeline for your pincode."
      },
      {
        q: "Can I return or exchange a product?",
        a: "See our Return & Refund Policy page for the current policy, or message us on WhatsApp with your order ID if you have an issue with a delivered product."
      },
      {
        q: "Is it safe to make UPI payments on this site?",
        a: "Yes. UPI payments go directly through your own UPI app (GPay, PhonePe, etc.) — we never store or have access to your bank details."
      },
      {
        q: "Do you ship across India?",
        a: "Message us on WhatsApp with your pincode before ordering to confirm delivery to your area."
      },
      {
        q: "How can I contact customer support?",
        a: "The fastest way is our WhatsApp chat button (bottom-right corner of any page), or the Contact Us form."
      }
    ];

    function renderFAQs() {
      const list = document.getElementById('faq-list');
      list.innerHTML = FAQS.map((item, i) => `
        <div class="faq-item" id="faq-${i}">
          <button class="faq-question" data-index="${i}">
            <span>${item.q}</span>
            <span class="icon">+</span>
          </button>
          <div class="faq-answer"><p>${item.a}</p></div>
        </div>
      `).join('');

      document.querySelectorAll('.faq-question').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = btn.closest('.faq-item');
          const answer = item.querySelector('.faq-answer');
          const isOpen = item.classList.contains('open');

          // Close all others (accordion behaviour)
          document.querySelectorAll('.faq-item.open').forEach(openItem => {
            openItem.classList.remove('open');
            openItem.querySelector('.faq-answer').style.maxHeight = null;
          });

          if (!isOpen) {
            item.classList.add('open');
            answer.style.maxHeight = answer.scrollHeight + 40 + 'px';
          }
        });
      });
    }

    renderFAQs();
  </script>
</body>
</html>
